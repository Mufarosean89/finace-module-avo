services:
  - type: static
    name: avo-finance-frontend
    staticPublishPath: avoconnect-myfinances-demo/avo-finance-app
  - type: web
    name: avo-finance-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd backend && python manage.py collectstatic --noinput
    startCommand: |
      cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SECRET_KEY
        # generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: avo-finance-db
          property: connectionString
databases:
  - name: avo-finance-db
    plan: free